<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيادة د. مصطفى صقر | البوابة الذكية للمرضى</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary: #0a365c;
            --secondary: #0d9488;
            --accent: #d97706;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
        }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; }

        /* الهيدر */
        .header {
            background: linear-gradient(135deg, var(--primary), #051e34);
            color: white;
            padding: 28px 20px 55px;
            text-align: center;
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
            box-shadow: 0 10px 25px rgba(10, 54, 92, 0.25);
        }
        .badge {
            background: rgba(217, 119, 6, 0.2);
            border: 1px solid #f59e0b;
            color: #fde68a;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 8px;
        }
        .header h1 { font-size: 23px; font-weight: 900; }
        .header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }

        /* شريط متابعة العيادة المباشر */
        .live-dashboard {
            background: var(--card);
            width: 92%;
            max-width: 460px;
            margin: -32px auto 18px;
            padding: 14px;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.07);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            text-align: center;
            border-top: 4px solid var(--secondary);
        }
        .dash-item { border-left: 1px solid #e2e8f0; }
        .dash-item:last-child { border-left: none; }
        .dash-item span { display: block; font-size: 11px; color: #64748b; }
        .dash-item strong { font-size: 14px; color: var(--primary); font-weight: 800; }
        .pulse {
            height: 8px; width: 8px; background: #10b981; border-radius: 50%;
            display: inline-block; margin-left: 4px; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        /* تذكرة الحجز المحفوظة للمريض */
        .saved-ticket {
            width: 92%; max-width: 460px; margin: 0 auto 16px;
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            border: 1px solid #10b981; border-radius: 16px; padding: 14px;
            display: none; position: relative;
        }
        .saved-ticket h4 { color: #065f46; font-size: 14px; margin-bottom: 4px; }
        .saved-ticket p { font-size: 12px; color: #047857; line-height: 1.5; }
        .clear-ticket { position: absolute; top: 12px; left: 12px; background: none; border: none; color: #dc2626; font-size: 11px; cursor: pointer; font-weight: 700; }

        .container { width: 92%; max-width: 460px; margin: 0 auto; }

        /* شبكة الأزرار */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
        .card-btn {
            background: var(--card); border: 1px solid #e2e8f0; padding: 16px 10px;
            border-radius: 16px; box-shadow: 0 3px 10px rgba(0,0,0,0.03);
            cursor: pointer; transition: 0.2s; text-align: center;
        }
        .card-btn.active {
            border: 2px solid var(--secondary); background: #f0fdfa;
            transform: translateY(-2px); box-shadow: 0 8px 16px rgba(13, 148, 136, 0.12);
        }
        .card-btn .icon { font-size: 24px; display: block; margin-bottom: 6px; }
        .card-btn h3 { font-size: 13px; font-weight: 800; color: var(--primary); }
        .card-btn p { font-size: 10px; color: #64748b; margin-top: 2px; }

        /* اللوحات الداخلية */
        .panel {
            background: var(--card); padding: 20px; border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.05); display: none;
            animation: slideUp 0.25s ease;
        }
        .panel.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .panel h2 { font-size: 16px; color: var(--primary); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid #f1f5f9; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: #334155; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px;
            font-size: 13px; outline: none; background: #f8fafc;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--secondary); background: #fff; }

        /* اختيار الموعد المسبق (Slots) */
        .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
        .slot {
            padding: 8px 4px; text-align: center; border: 1px solid #cbd5e1;
            border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; background: #fff;
        }
        .slot.selected { background: var(--secondary); color: white; border-color: var(--secondary); }
        .slot.busy { background: #f1f5f9; color: #94a3b8; text-decoration: line-through; cursor: not-allowed; }

        .btn-submit {
            width: 100%; background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: white; border: none; padding: 13px; border-radius: 12px;
            font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 8px;
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
        }

        /* المساعد الذكي */
        .bot-box { background: #f8fafc; padding: 14px; border-radius: 12px; border-right: 4px solid var(--secondary); font-size: 13px; line-height: 1.6; margin-bottom: 12px; }
        .quick-replies { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .q-btn { background: #e0f2fe; color: #0369a1; border: none; padding: 8px; border-radius: 10px; font-size: 12px; cursor: pointer; font-weight: 700; text-align: right; }

        /* بطاقة الإجراءات السريعة */
        .service-tag { display: flex; justify-content: space-between; align-items: center; padding: 10px; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 8px; font-size: 12px; }
        .service-tag span { font-weight: 700; color: var(--primary); }
        .service-tag b { color: var(--secondary); }
    </style>
</head>
<body>

    <div class="header">
        <div class="badge">النظام الذكي للحجز المسبق ومتابعة الدور</div>
        <h1>عيادة د. مصطفى صقر</h1>
        <p>احجز دورك مسبقاً وتابع تفاصيل زيارتك من مكانك</p>
    </div>

    <!-- لوحة البيانات الحية -->
    <div class="live-dashboard">
        <div class="dash-item">
            <span>حالة العيادة</span>
            <strong><i class="pulse"></i> مفتوح</strong>
        </div>
        <div class="dash-item">
            <span>الحجز المسبق</span>
            <strong>متاح (أونلاين)</strong>
        </div>
        <div class="dash-item">
            <span>أولوية الدخول</span>
            <strong>بأسبقية الحجز</strong>
        </div>
    </div>

    <!-- تذكرة المريض المحفوظة تلقائياً -->
    <div class="saved-ticket" id="ticketBox">
        <button class="clear-ticket" onclick="clearTicket()">[إلغاء التذكرة]</button>
        <h4>🎟️ لديك حجز مسبق مسجل</h4>
        <p id="ticketDetails"></p>
    </div>

    <div class="container">
        <div class="grid">
            <button class="card-btn active" onclick="showPanel('book', this)">
                <span class="icon">📅</span>
                <h3>الحجز المسبق</h3>
                <p>اختر اليوم والفترة المناسبة</p>
            </button>
            <button class="card-btn" onclick="showPanel('modify', this)">
                <span class="icon">🔄</span>
                <h3>تعديل / إلغاء</h3>
                <p>تغيير ميعاد حجزك</p>
            </button>
            <button class="card-btn" onclick="showPanel('bot', this)">
                <span class="icon">🤖</span>
                <h3>الأسعار والاستفسار</h3>
                <p>كشف، حقن، وعنوان العيادة</p>
            </button>
            <button class="card-btn" onclick="showPanel('direct', this)">
                <span class="icon">⚡</span>
                <h3>إجراء سريع / طوارئ</h3>
                <p>حقن، اختبار حساسية، تواصل</p>
            </button>
        </div>

        <!-- 1. لوحة الحجز المسبق -->
        <div id="book" class="panel active">
            <h2>📅 نظام الحجز المسبق الذكي</h2>
            <div class="form-group">
                <label>اسم المريض بالكامل</label>
                <input type="text" id="pName" placeholder="اكتب الاسم الثلاثي...">
            </div>
            <div class="form-group">
                <label>رقم الموبايل (واتساب للتأكيد)</label>
                <input type="tel" id="pPhone" placeholder="010xxxxxxxx">
            </div>
            <div class="form-group">
                <label>نوع الزيارة والخدمة</label>
                <select id="pType">
                    <option value="كشف جديد (200 جنيه)">كشف طبي جديد — 200 جنيه</option>
                    <option value="استشارة ومتابعة (مجاناً)">استشارة / متابعة — مجاناً (خلال 10 أيام)</option>
                    <option value="كشف مستعجل VIP (300 جنيه)">كشف مستعجل (دخول فوري) — 300 جنيه</option>
                </select>
            </div>
            <div class="form-group">
                <label>تاريخ الحجز المسبق</label>
                <input type="date" id="pDate">
            </div>
